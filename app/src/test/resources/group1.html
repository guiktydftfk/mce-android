<script type="text/javascript">
    $(document).ready(function(){
    	//右侧浮动链接初始化变量
        var web_stop = 0, web_top = 0;        
        var isScrolling = false;
        
        //图片懒加载
        $("img.lazys").lazyload();

        //处理侧栏导航
        $('body').prepend($('#navright'));
        $('.mm-menu, .mm-mask').height($(window).height() + 100);
        $('.mm-openmenu').click(function() {
            $('body').addClass('mm-opening');
            $('.mm-mask').delay(300).fadeIn();
        });
        $('.mm-mask').click(function() {
            $('body').removeClass('mm-opening');
            $(this).hide();
        });
        
        //用户自定义风格
        $('.mm-menubottom li').click(function() {
            var styleID = $(this).attr('id');
            var colorID = $(this).data('color');
            switchSkin(styleID, colorID, 1)
        });
        var styleID = $.cookie('styleID');
        if (styleID) {
            switchSkin(styleID, 0, 0)
        };
                        
        //页眉浮动功能
        $(window).scroll(function(){
            var bnerheight = $('.hideheader').outerHeight();
            var coverheight = $('.sortrollheight').outerHeight()+0;
            if( bnerheight > 0){
                coverheight = coverheight-($('.header').height());
            };
            if($(window).scrollTop() > coverheight){
                $('.sortmenus').addClass('sortmenu_top');
            }else{
                $('.sortmenus').removeClass('sortmenu_top');
            }
        });
                
        //右侧浮动链接
        $(window).scroll(function() {
            if (!isScrolling) {            	
                if ($(window).scrollTop() > 80) {
                	web_stop = $(window).scrollTop();
                    if (web_top <= web_stop) {
                    	handleScrollClass(true);
                    } else {
                    	handleScrollClass(false);
                    }
                } else {
                	handleScrollClass(false);
                }
                web_top = web_stop
            }
        });
        
    });
    
    //自定义风格函数
    function switchSkin(s, c, i) {
        $('#' + s).addClass('on').siblings().removeClass('on');
        if (i == 1) {
            var cssHref = 'template/v2_mbl20121009/touch_plus/css/diy/' + s + '.css';
            var defaultcssHref = 'data/cache/' + s + '.css';
            if (s == 'style_0') {
                $('#cssfile').attr('href', defaultcssHref)
            } else {
                $('#cssfile').attr('href', cssHref)
            }
            $.cookie('styleID', s, {
                path: '/',
                expires: 30
            });
            $.cookie('colorID', c, {
                path: '/',
                expires: 30
            })
        }
    }
    
    //右侧浮动链接处理函数
    function handleScrollClass(shouldAdd){
    	$('.scroll_plus,.scroll_openmenu').toggleClass('scroll_hide',shouldAdd);
    }
    </script>
